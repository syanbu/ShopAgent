[project]
name = "shop-agent"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "syanbu", email = "syanbu@noreply.gitcode.com" }
]
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20",
    "dashscope>=1.24",
    "fastapi>=0.115",
    "langgraph>=1.1",
    "openai>=1.60",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "qdrant-client>=1.13",
    "sse-starlette>=2.2",
    "uvicorn[standard]>=0.34",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
markers = [
    "live: opt-in tests that call real external services",
]
